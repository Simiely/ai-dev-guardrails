name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'schema/**'
      - 'tools/**'
      - 'pack/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'README.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'llms.txt'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Manual lint
        run: guardrails --root pack lint-manual
      - name: Generated views
        run: guardrails --root pack sync --check
      - name: Routing eval
        run: guardrails --root pack eval-routing
      - name: Invariants (knowledge)
        # 没有 sources.json，不需要 --changed-since / 同 PR co-change。
        run: python tools/repo-kit/check_repo.py --root .
      - name: Generated artifacts are up to date
        run: python tools/repo-kit/generate.py --root . --check
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
