# guardrails.yaml — 架构契约与手册配置的唯一机器源
# 规则：modules/ 下每个目录都必须在这里登记；新增模块 = R3。
version: 1

project:
  name: example
  languages: [typescript, python]
  # Python 包名不是 <name>.<layer> 时配置：
  # python:
  #   root_package: app
  #   layer_packages:
  #     domain: app.domain
  #     application: app.application
  #     adapter: app.adapter

# 依赖只允许从左往右；禁止反向依赖与循环依赖。
layers:
  - domain
  - application
  - adapter

modules: []
# 示例：
# modules:
#   - name: order
#     path: modules/order
#     layer: application
#     owner: "@owner"
#     contract: modules/order/CONTRACT.md
#     public_path: modules/order/CONTRACT.ts
#     depends_on: [payment]
#     public_api: [OrderService.cancel]

contracts: []
# 示例：
# contracts:
#   - id: http.order
#     path: openapi/order.yaml
#     kind: openapi
#     consumers: [web, mobile]

protected:
  - ARCHITECTURE.md
  - guardrails.yaml
  - adr/**
  - AGENTS.md
  - manual/**
  - specs/**/raw/**
  - .github/**

# agent 不可见的验收测试；CI 单独跑
holdout: acceptance/holdout

risk:
  # 老项目接入时建议改成 R2；未登记文件不会被误判为低风险。
  unknown_default: R1
  R3:
    - openapi/**
    - migrations/**
    - auth/**
    - package.json
    - pyproject.toml
    - guardrails.yaml
  R2:
    - modules/**

manual:
  root: manual
  card: manual/00-card.md
  chapters: manual/chapters
  max_chapters: 6
  max_loaded_per_task: 3
  token_budget: 4000

adapters:
  agents: AGENTS.md
  claude: .claude/skills
  kiro: .kiro/steering
  cursor: .cursor/rules

commands:
  affected: "echo 'TODO: affected tests'"
  full: "echo 'TODO: full tests'"
  typecheck: "echo 'TODO: typecheck'"
  lint: "echo 'TODO: lint'"
  architecture: "guardrails sync --check"
  # contract 需要真实快照路径；有契约时再取消注释并改成你的路径：
  # contract: "guardrails contract diff --base .guardrails/contracts/openapi.json --current openapi.yaml"
  # mutation: "npx stryker run --incremental"
