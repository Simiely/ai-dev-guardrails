# 模块登记表
# 规则：modules/ 下每个目录都必须在这里登记，否则 CI 失败。
# 新增模块 = T3，需要 ADR + 人批。

version: 1

rules:
  # 依赖只允许从左往右，禁止反向
  dependency_direction:
    - domain
    - application
    - adapter
  # 禁止跨模块 import 内部文件，只能 import 对方的 CONTRACT
  forbid_internal_import: true

modules:
  # 示例（启用时删掉注释）：
  # - name: order
  #   path: modules/order
  #   owner: <owner>
  #   contract: modules/order/CONTRACT.md
  #   depends_on: []
